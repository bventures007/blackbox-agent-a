[package]
name = "blackbox-engine"
version = "0.1.0"
edition = "2024"
[dependencies]
blackbox-domain = { path = "../../crates/domain" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
axum = "=0.8.6"
tokio = { version = "=1.48.0", features = ["full"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json"] }
lru = "=0.16.2"
subtle = "=2.6.1"
