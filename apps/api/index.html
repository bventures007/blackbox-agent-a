<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blackbox · Local pilot</title>
    <link rel="stylesheet" href="/ui.css" />
  </head>
  <body>
    <aside>
      <h1>▥ blackbox<span> .</span></h1>
      <p id="pilot"></p>
      <button id="language">Deutsch</button>
    </aside>
    <main>
      <h2 id="heading"></h2>
      <p id="intro"></p>
      <form id="login">
        <label id="keylabel" for="key"></label
        ><input
          id="key"
          type="password"
          autocomplete="current-password"
          required
        /><label
          ><input id="remember" type="checkbox" /><span
            id="rememberlabel"
          ></span></label
        ><button id="signin" type="submit"></button>
      </form>
      <section id="workspace" hidden>
        <p id="status" role="status"></p>
        <button id="refresh"></button><button id="logout"></button>
        <h3 id="journalheading"></h3>
        <div id="journal"></div>
        <h3 id="answerheading"></h3>
        <form id="query">
          <label id="entitylabel" for="entity"></label
          ><input id="entity" required /><button id="ask"></button>
        </form>
        <pre id="answer"></pre>
      </section>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="/ui.js"></script>
  </body>
</html>
