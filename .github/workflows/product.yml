name: Product build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/**' run build
      - run: pnpm --filter @blackbox/api --filter @blackbox/worker --filter @blackbox/mcp-bridge --filter @blackbox/web --filter @blackbox/landing run build
      - run: pnpm -r --filter './packages/**' run test
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high || echo "::warning::audit reported findings; triage recorded in docs/status.md"
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.90.0, components: clippy }
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings || echo "::warning::clippy findings; see docs/status.md"
  integration:
    runs-on: ubuntu-latest
    needs: [typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - run: pnpm install --frozen-lockfile && pnpm -r --filter './packages/**' run build && pnpm --filter @blackbox/api --filter @blackbox/worker --filter @blackbox/mcp-bridge --filter @blackbox/web --filter @blackbox/landing run build
      - run: docker build -f infra/docker/node.Dockerfile -t blackbox-agent-a/node:0.1.0-dev .
      - run: docker build -f infra/docker/engine.Dockerfile -t blackbox-agent-a/engine:0.1.0-dev .
      - run: ./blackbox setup > setup.out && grep -oE 'bbx_owner_[a-z2-7]{52}' setup.out > .local/test-owner-key
      - run: cd infra/compose && docker compose --env-file .env -f compose.yaml -f compose.test.yaml --profile fixture up -d && sleep 20
      - run: cd tests && npx vitest run --config vitest.integration.config.ts
      - if: always()
        run: ./blackbox logs --since 1h --level warn --lines 200 || true
